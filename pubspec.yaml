name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Android project files cleanly
        run: |
          rm -rf android_temp
          flutter create --platforms=android --project-name sual_wa_maalouma --org com.hakim.sualwamaalouma android_temp
          cp -r android_temp/android .
          rm -rf android_temp

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sual-wa-maalouma-apk
          path: build/app/outputs/flutter-apk/app-release.apk
